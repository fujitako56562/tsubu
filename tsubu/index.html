<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>tsubu</title>
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="tsubu">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-row">
        <img class="me" src="images/icon-me.png" alt="">
        <div class="logo" aria-label="tsubu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="13" r="8"/><circle cx="19" cy="5" r="3"/></svg>
          <span>tsubu</span>
        </div>
      </div>
      <nav class="tabs">
        <button class="tab active">おすすめ</button>
        <button class="tab">フォロー中</button>
      </nav>
    </header>

    <main id="timeline" class="timeline"></main>

    <nav class="bottomnav">
      <button class="nav-btn active" aria-label="ホーム"><svg viewBox="0 0 24 24"><path d="M3.5 10.5 12 3.8l8.5 6.7V20h-5.8v-5.6H9.3V20H3.5z"/></svg></button>
      <button class="nav-btn" aria-label="さがす"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.2"/><path d="m15.2 15.2 5 5"/></svg></button>
      <button class="nav-btn" aria-label="おしらせ"><svg viewBox="0 0 24 24"><path d="M5.5 17V11a6.5 6.5 0 0 1 13 0v6l1.5 1.6H4z"/><path d="M9.8 21a2.3 2.3 0 0 0 4.4 0"/></svg></button>
      <button class="nav-btn" aria-label="メッセージ"><svg viewBox="0 0 24 24"><rect x="3.2" y="5.5" width="17.6" height="13" rx="2.2"/><path d="m4 7 8 6 8-6"/></svg></button>
    </nav>

    <button id="fab" class="fab" aria-label="投稿を作成">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <section id="compose" class="compose" aria-hidden="true">
    <header class="compose-head">
      <button id="cancelBtn" class="text-btn">キャンセル</button>
      <button id="postBtn" class="pill" disabled>投稿する</button>
    </header>
    <div class="compose-body">
      <img class="avatar" src="images/icon-me.png" alt="">
      <textarea id="draft" placeholder="いま、どんな気持ち？" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
    </div>
    <footer class="compose-foot">
      <span class="audience">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.6 2.6 14.4 0 17M12 3.5c-2.6 2.6-2.6 14.4 0 17"/></svg>
        全員が返信できます
      </span>
      <span id="count" class="count">0</span>
    </footer>

    <div id="dialog" class="dialog" role="dialog" aria-modal="true">
      <div class="dialog-card">
        <h2>下書きを破棄しますか？</h2>
        <p>入力した内容は保存されません。</p>
        <button id="discardBtn" class="pill danger">破棄</button>
        <button id="keepBtn" class="pill outline">キャンセル</button>
      </div>
    </div>
  </section>

  <div class="rotate-notice">縦向きでご利用ください</div>

  <script src="app.js"></script>
</body>
</html>
